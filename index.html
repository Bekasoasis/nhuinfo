<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>南華大學校務資訊公開專區</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@700;900&family=Noto+Sans+TC:wght@400;500;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/echarts/5.5.0/echarts.min.js"></script>
<style>
:root{
  --red:#ae0105;          /* 校徽取樣 */
  --ink:#1c1c1c; --sub:#6d6d6d; --line:#e8e8e8; --bg:#ffffff; --tint:#faf9f7;
  --ok:#2f7d4f;
}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{font-family:"Noto Sans TC",sans-serif;background:var(--bg);color:var(--ink);
  line-height:1.8;padding-left:72px}
a{color:var(--red);text-decoration:none}
img{max-width:100%}

/* ── 左側圖示導覽列（仿 global.hokudai.ac.jp）── */
.rail{position:fixed;left:0;top:0;bottom:0;width:72px;background:#fff;border-right:1px solid var(--line);
  display:flex;flex-direction:column;align-items:center;padding:.5rem 0;gap:.1rem;z-index:60}
.rail button, .rail a{display:flex;flex-direction:column;align-items:center;gap:.15rem;width:64px;
  padding:.55rem 0;border:0;background:none;cursor:pointer;color:#555;font-size:.6rem;
  font-family:inherit;border-radius:8px;text-decoration:none}
.rail .ic{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
.rail button:hover,.rail a:hover{background:#f4f4f4;color:var(--ink)}
.rail a.on{color:var(--red);font-weight:500}
.rail .burger{margin-bottom:.4rem}

/* ── 全螢幕選單 ── */
#menu{position:fixed;inset:0;background:rgba(255,255,255,.98);z-index:70;display:none;
  overflow-y:auto;padding:2.2rem clamp(1.2rem,6vw,5rem)}
#menu.open{display:block}
#menu .close{position:absolute;top:1.2rem;right:1.4rem;font-size:1.6rem;border:0;background:none;cursor:pointer;color:var(--ink)}
#menu h2{font-size:.85rem;letter-spacing:.25em;color:var(--red);margin:1.6rem 0 .5rem;font-weight:700}
#menu .cols{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:0 2.5rem}
#menu a{display:block;color:var(--ink);padding:.34rem 0;border-bottom:1px solid var(--line);font-size:.95rem}
#menu a:hover{color:var(--red)}

/* ── 頂列 ── */
.topbar{display:flex;align-items:center;gap:.9rem;padding:1rem clamp(1rem,4vw,2.4rem);
  border-bottom:1px solid var(--line);background:#fff}
.topbar img{height:46px;width:46px}
.topbar .t1{font-weight:700;font-size:1.08rem;letter-spacing:.04em}
.topbar .t2{font-size:.7rem;color:var(--sub);letter-spacing:.14em}
.topbar .mburger{display:none;margin-left:auto;border:1px solid var(--line);background:#fff;
  border-radius:8px;padding:.4rem .7rem;font-size:1.1rem;cursor:pointer}

/* ── Hero ── */
.hero{position:relative;height:52vh;min-height:330px;background:#333;overflow:hidden}
/* 照片亮度調整處：opacity 越接近 1 越亮；.grad 的 .30/.12 為文字區暗角深淺 */
.hero img.campus{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;opacity:1}
.hero .grad{position:absolute;inset:0;background:linear-gradient(100deg,rgba(0,0,0,.30) 0%,rgba(0,0,0,.06) 50%,rgba(0,0,0,.12))}
.hero .inner{position:relative;height:100%;display:flex;flex-direction:column;justify-content:center;
  padding:0 clamp(1.2rem,6vw,4.5rem);color:#fff}
.hero .big{font-family:"Noto Serif TC",serif;font-weight:900;font-size:clamp(3.4rem,9vw,6.5rem);
  color:var(--red);line-height:1;text-shadow:0 1px 0 rgba(255,255,255,.55),0 2px 14px rgba(0,0,0,.35);letter-spacing:.02em}
.hero .big small{font-size:.32em;color:#fff;font-family:"Noto Sans TC",sans-serif;font-weight:500;margin-left:.5rem;letter-spacing:.08em;text-shadow:0 1px 8px rgba(0,0,0,.7)}
.hero .big.txt{font-size:clamp(1.9rem,4.6vw,3.3rem);line-height:1.3;letter-spacing:.06em;text-shadow:0 1px 2px rgba(255,255,255,.3),0 2px 12px rgba(0,0,0,.45)}
.hero .big.txt small{display:block;margin-left:0;margin-top:.35rem;font-size:.55em;letter-spacing:.12em}
.hero .sub{margin-top:.8rem;font-size:.95rem;max-width:620px;color:#fff;text-shadow:0 1px 6px rgba(0,0,0,.65)}
.hero .cap{position:absolute;right:1.2rem;bottom:.9rem;font-size:.78rem;color:#ddd;letter-spacing:.1em}
.hero .hint{position:absolute;left:1.2rem;bottom:.9rem;font-size:.7rem;color:#bbb}

/* ── 內容 ── */
main{min-height:55vh}
.wrap{max-width:1060px;margin:0 auto;padding:2rem clamp(1rem,4vw,2rem) 3.5rem}
.crumb{font-size:.78rem;color:var(--sub);margin-bottom:.5rem}
.page-head{display:flex;flex-wrap:wrap;align-items:baseline;gap:.8rem;margin-bottom:1rem;
  border-bottom:2px solid var(--ink);padding-bottom:.7rem}
h1.page{font-size:1.55rem;font-weight:700;letter-spacing:.02em}
h1.page::before{content:"";display:inline-block;width:.5em;height:.9em;background:var(--red);
  margin-right:.5rem;transform:translateY(.08em)}
.badge{font-size:.75rem;border:1px solid var(--line);color:var(--sub);border-radius:999px;padding:.1rem .7rem;margin-left:auto}

/* 文字說明：≥14pt */
.txt{background:var(--tint);border-left:4px solid var(--red);padding:1rem 1.3rem;margin:0 0 1.6rem}
.txt p{font-size:14pt;line-height:1.95}
.txt p+p{margin-top:.6rem}
.srcnote{font-size:.76rem;color:var(--sub);margin-top:.6rem}

section.blk{margin-bottom:2.4rem}
section.blk>h2{font-size:1.1rem;font-weight:700;margin-bottom:.8rem;padding-left:.7rem;border-left:4px solid var(--red)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:2rem}
@media(max-width:860px){.grid2{grid-template-columns:1fr}}

/* 互動控制列（仿教育部統計處） */
.ctrl{display:flex;flex-wrap:wrap;gap:.9rem 1.6rem;align-items:center;padding:.8rem 1rem;
  background:var(--tint);border:1px solid var(--line);border-radius:10px;margin-bottom:.8rem;font-size:.85rem}
.ctrl .g{display:flex;flex-wrap:wrap;gap:.35rem;align-items:center}
.ctrl .lab{color:var(--sub);margin-right:.15rem}
.chip{border:1px solid #cfcfcf;border-radius:999px;padding:.12rem .75rem;cursor:pointer;user-select:none;background:#fff}
.chip.on{border-color:var(--red);color:var(--red);background:#fdf3f3;font-weight:500}
.chart{width:100%;height:340px}
details.tbl{margin-top:.6rem}
details.tbl summary{cursor:pointer;font-size:.82rem;color:var(--red)}
a.dl{font-size:.78rem;color:var(--sub);border:1px solid var(--line);border-radius:999px;padding:.08rem .7rem}
a.dl:hover{color:var(--red);border-color:var(--red)}
table{width:100%;border-collapse:collapse;font-size:.875rem;margin-top:.5rem}
th{border-bottom:2px solid var(--ink);padding:.5rem .6rem;text-align:left;white-space:nowrap;font-weight:700}
td{border-bottom:1px solid var(--line);padding:.45rem .6rem;font-variant-numeric:tabular-nums}
td.neg{color:var(--red);font-weight:500}
.tscroll{overflow-x:auto}

/* KPI 進度條 */
.kpirow{display:grid;grid-template-columns:minmax(170px,1.3fr) 3fr auto;gap:.9rem;align-items:center;
  padding:.6rem 0;border-bottom:1px solid var(--line);font-size:.92rem}
.bar{background:#eee;border-radius:999px;height:12px;overflow:hidden}
.bar i{display:block;height:100%;background:#c9a45c;width:0;transition:width 1s cubic-bezier(.2,.7,.3,1)}
.bar i.over{background:var(--ok)} .bar i.miss{background:var(--red)}
.kv{font-variant-numeric:tabular-nums;white-space:nowrap;font-size:.84rem;color:var(--sub)}

/* 首頁導覽卡 */
.navcards{display:grid;grid-template-columns:repeat(auto-fit,minmax(290px,1fr));gap:1px;background:var(--line);
  border:1px solid var(--line);margin-top:2rem}
.navcard{background:#fff;padding:1.4rem 1.4rem 1.2rem;color:var(--ink)}
.navcard:hover{background:var(--tint)}
.navcard .no{font-size:.72rem;letter-spacing:.3em;color:var(--red)}
.navcard h3{font-size:1.05rem;margin:.25rem 0 .35rem}
.navcard p{font-size:.82rem;color:var(--sub)}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:1px;background:var(--line);border:1px solid var(--line)}
.kpi{background:#fff;padding:1rem 1.2rem}
.kpi .label{font-size:.8rem;color:var(--sub)}
.kpi .num{font-family:"Noto Serif TC",serif;font-size:1.9rem;font-weight:900;font-variant-numeric:tabular-nums}
.kpi .num.neg{color:var(--red)}
.kpi .unit{font-size:.85rem;color:var(--sub);margin-left:.2rem}

/* 第二層子導覽 */
.subnav{border-bottom:1px solid var(--line);background:#fff;position:sticky;top:0;z-index:40}
.subnav .in{max-width:1060px;margin:0 auto;padding:.5rem clamp(1rem,4vw,2rem);display:flex;flex-wrap:wrap;gap:.4rem}
.subnav a{font-size:.82rem;border:1px solid #d9d9d9;border-radius:999px;padding:.12rem .8rem;color:var(--ink)}
.subnav a.on{background:var(--red);border-color:var(--red);color:#fff;font-weight:500}
.actions{display:flex;flex-wrap:wrap;gap:.7rem;align-items:center;border-top:1px solid var(--line);padding-top:1rem}
.btn{font-size:.83rem;border:1px solid var(--ink);border-radius:999px;padding:.28rem 1rem;color:var(--ink);background:#fff}
.btn:hover{background:var(--ink);color:#fff}
.owner{font-size:.78rem;color:var(--sub)}
.notice{border:1px dashed #cfcfcf;padding:1.1rem 1.3rem;font-size:14pt;line-height:1.9;background:var(--tint)}
.form{display:grid;gap:.7rem;max-width:560px;font-size:.9rem}
.form label{font-size:.82rem;color:var(--sub)}
.form input,.form select,.form textarea{width:100%;padding:.55rem .7rem;border:1px solid #cfcfcf;border-radius:6px;font:inherit}
.form button{justify-self:start;background:var(--red);color:#fff;border:0;border-radius:999px;padding:.5rem 1.5rem;font:inherit;cursor:pointer}
.tl{border-left:2px solid var(--red);margin-left:.4rem;padding-left:1.4rem}
.tl li{list-style:none;margin-bottom:1rem;position:relative;font-size:.95rem}
.tl li::before{content:"";position:absolute;left:-1.72rem;top:.5em;width:9px;height:9px;border-radius:50%;background:var(--red)}
.tl .yr{font-weight:700;color:var(--red);margin-right:.6rem}
.swot{display:grid;grid-template-columns:1fr 1fr;gap:1px;background:var(--line);border:1px solid var(--line)}
@media(max-width:640px){.swot{grid-template-columns:1fr}}
.swot div{background:#fff;padding:1rem 1.2rem;font-size:.92rem}
.swot b{display:block;margin-bottom:.3rem}
.org{--adm:#7ca254;--aca:#4a78b0;--ctr2:#e0912f}
.orgchain{display:flex;flex-direction:column;align-items:center;margin-bottom:1.4rem}
.orgchain .lvl{display:flex;align-items:center;gap:.8rem}
.orgchain .box{border:2px solid var(--ink);background:#fff;padding:.25rem 1.6rem;font-weight:700;font-size:1rem}
.orgchain .side{border:1px solid #999;background:#fff;padding:.15rem .8rem;font-size:.8rem;color:#333}
.orgchain .vline{width:2px;height:16px;background:var(--ink)}
.orgcols{display:grid;grid-template-columns:1.15fr 1.45fr .65fr;gap:1rem}
@media(max-width:900px){.orgcols{grid-template-columns:1fr}}
.ogcol{border:1px solid var(--line)}
.ogcol h3{color:#fff;text-align:center;font-size:1rem;padding:.35rem}
.ogcol.adm h3{background:var(--adm)} .ogcol.aca h3{background:var(--aca)} .ogcol.ctr h3{background:var(--ctr2)}
.ogrow{display:grid;grid-template-columns:118px 1fr;border-top:1px solid var(--line);font-size:.85rem}
.ogrow:hover{background:#fbf8f2}
.ogrow .n{padding:.4rem .5rem;font-weight:700;display:flex;align-items:center;justify-content:center;text-align:center}
.adm .ogrow .n{background:#eef4e6;color:#3f5a26} .aca .ogrow .n{background:#e8eef6;color:#28466e}
.ogrow .d{padding:.4rem .6rem;border-left:1px solid var(--line);display:flex;align-items:center}
.ctr .cbox{border:1.5px solid var(--ctr2);color:#8a5514;text-align:center;font-weight:700;
  padding:.7rem .4rem;margin:.7rem .6rem;font-size:.9rem;background:#fff}
@media (prefers-reduced-motion: no-preference){
  .org>*{opacity:0;transform:translateY(8px);animation:orgin .5s ease forwards}
  .org>*:nth-child(2){animation-delay:.15s}
  @keyframes orgin{to{opacity:1;transform:none}}
}
.swot .s b{color:var(--ok)} .swot .w b{color:var(--red)} .swot .o b{color:#2f5d8a} .swot .t b{color:#7a5c8a}

footer{border-top:1px solid var(--line);padding:1.6rem clamp(1rem,4vw,2.4rem);font-size:.78rem;color:var(--sub);
  display:flex;flex-wrap:wrap;gap:.8rem;align-items:center}
footer img{height:34px;width:34px}

@media(max-width:900px){
  body{padding-left:0}
  .rail{display:none}
  .topbar .mburger{display:block}
}
@media (prefers-reduced-motion: reduce){*{transition:none !important}}
</style>
</head>
<body>

<!-- 左側圖示導覽 -->
<nav class="rail" aria-label="主要導覽">
  <button class="burger" onclick="toggleMenu(true)" aria-label="開啟選單">
    <svg class="ic" viewBox="0 0 24 24"><path d="M3 6h18M3 12h18M3 18h18"/></svg><span>選單</span></button>

  <a href="#/2-1" data-id="s2"><svg class="ic" viewBox="0 0 24 24"><path d="M4 20h16M6 16l4-5 3 3 5-7"/></svg><span>財務資訊</span></a>
  <a href="#/3-1" data-id="s3"><svg class="ic" viewBox="0 0 24 24"><path d="M2 9l10-5 10 5-10 5L2 9zM6 11v5c0 1.5 3 3 6 3s6-1.5 6-3v-5M22 9v6"/></svg><span>學雜費</span></a>
  <a href="#/4-1" data-id="s4"><svg class="ic" viewBox="0 0 24 24"><path d="M6 2h9l5 5v15H6zM14 2v6h6M9 13h6M9 17h6"/></svg><span>其他資訊</span></a>
  <a href="#/5-1" data-id="s5"><svg class="ic" viewBox="0 0 24 24"><path d="M12 2l8 3v6c0 5-3.5 8.5-8 11-4.5-2.5-8-6-8-11V5l8-3zM9 12l2 2 4-4"/></svg><span>內控內稽</span></a>
  <a href="#/6-1" data-id="s6"><svg class="ic" viewBox="0 0 24 24"><path d="M4 5h16v11H9l-5 4V5zM8 9h8M8 12h5"/></svg><span>意見回饋</span></a>
</nav>

<!-- 全螢幕選單 -->
<div id="menu" role="dialog" aria-label="網站選單">
  <button class="close" onclick="toggleMenu(false)" aria-label="關閉選單">✕</button>
  <div id="menuBody"></div>
</div>

<!-- 頂列 -->
<header class="topbar">
  <img src="logo.png" alt="南華大學校徽" onerror="this.style.display='none'">
  <div>
    <div class="t1">南華大學 校務資訊公開專區</div>
    <div class="t2">NANHUA UNIVERSITY — SCHOOL AFFAIRS &amp; FINANCIAL DISCLOSURE</div>
  </div>
  <button class="mburger" onclick="toggleMenu(true)" aria-label="開啟選單">☰</button>
</header>

<div class="subnav" id="subnav" hidden><div class="in" id="subnavIn"></div></div>

<main id="main"></main>

<footer>
  <img src="logo.png" alt="" onerror="this.style.display='none'">
  <span>南華大學校務資訊公開專區｜依教育部「大專校院校務及財務資訊公開內容架構表」建置｜私立學校以學年度、決算書數據為基準｜示範資料標示者尚待正式數據替換｜<b>build 20260918a</b></span>
</footer>

<script>
/* =====================================================================
   Google 試算表資料層
   第一層＝一個試算表檔案；第二層＝檔案內的分頁（sheet）
   ── 設定方式見「Google試算表維護手冊」──
   試算表需設定「知道連結的使用者：檢視者」，將檔案 ID 貼入下方 CONFIG。
   ID 留空或讀取失敗時，自動改用內嵌示範資料（頁面會標示 ⚠）。
   ===================================================================== */
/* 單一總表模式：全站資料集中於一份試算表，各第二層內容＝其中一個分頁。
   換資料來源只需改 MASTER_ID；「文字說明」全站共用一個分頁（頁碼＋段落）。
   日後若要拆回一大項一檔，把各 id 改成各自檔案 ID、並於各檔自建文字說明分頁即可。 */
const MASTER_ID = '1Gz5NCBJhDkDgtwZJlbhytnVFy7EgQlyVZY6ZyRY6Fvo';
/* 資料服務端點（Apps Script 網頁應用程式網址）。
   填入後：網站改由此端點取得資料（單次請求取回全部分頁），
   試算表本身即可改回「限制」不對外共用，外界無法開啟或下載原始檔。
   部署步驟見維護手冊；未填或失效時退回 gviz（需試算表開放檢視）→ 再退回內嵌示範資料。 */
const GAS_URL = '';
const CONFIG = {
  S1:{ id:MASTER_ID, name:'校務資訊公開資料總表', sheets:['沿革','組織架構','學生人數','教職員人數','生師比','資源概況','招生就學','境外生','SWOT','特色主題','評鑑結果','畢業生流向','KPI','董事會財務','董事會收支','文字說明'] },
  S2:{ id:MASTER_ID, name:'校務資訊公開資料總表', sheets:['收支總覽','收入','支出'] },
  S3:{ id:MASTER_ID, name:'校務資訊公開資料總表', sheets:['收費與成本','支出估算','助學措施','助學統計'] },
  S4:{ id:MASTER_ID, name:'校務資訊公開資料總表', sheets:['報告清單','採購處分連結','設備效益','其他連結'] },
  S5:{ id:MASTER_ID, name:'校務資訊公開資料總表', sheets:['文件清單','稽核清單'] },
  S6:{ id:MASTER_ID, name:'意見回饋', sheets:['意見回應'] },
};
const LOADED = new Set();   // 已成功載入的「檔案:分頁」

/* ── 內嵌示範資料（結構與 Google 試算表一致；標示※者為委員意見引用之實際數據）── */
const DATA = {
S1:{
 '沿革':[['年代','大事紀'],
  ['82年','佛光山星雲大師發起「百萬人興學」募款，籌設南華管理學院'],
  ['85年','奉教育部核准立案招生，8月1日由創辦人星雲大師舉行開校啟教儀式，為「佛光山教團系統大學」在國內設立的第一所大學校院；完成第一行政教學大樓「成均館」、學生宿舍「文會樓」'],
  ['86年','完成第二教學大樓「學海堂」、教職員宿舍「雲水居」、圖書館「無盡藏」及學生宿舍「麗澤樓」'],
  ['88年','奉准升格為南華大學，創下國內學院升格大學的最短時間紀錄；設管理、人文及社會科學三學院'],
  ['92年','新建完成第三教學大樓「學慧樓」'],
  ['95年','增設科技學院與藝術學院，成為兼具管理、人文、社會、科技與藝術之綜合性大學'],
  ['103年','入學新生全面比照國立大學收費；完成九品蓮花大道景觀工程'],
  ['104年','完成 1,600 床位之「緣起樓」學生及單身職務宿舍'],

 '文字說明':[['頁碼','段落'],
  ['1-1','【創校緣起】南華大學前身為南華管理學院，是佛光山星雲大師於民國 82 年發起「百萬人興學」募款而創設，於民國 85 年 4 月 1 日奉教育部核准立案招生，同年 8 月 1 日由創辦人星雲大師舉行開校啟教儀式，為「佛光山教團系統大學」於國內設立的第一所大學校院。'],
  ['1-1','秉持星雲大師「懷具百年樹人之志、回饋十方感恩之心」的社會責任信念，本校在教學品質、教學環境、導師制度獎優扶弱及學生人格健全發展等方面均極為重視，並獲教育部肯定，奉准於民國 88 年 8 月 1 日升格為大學，創下國內學院升格大學的最短時間紀錄。'],
  ['1-1','本校創校宗旨為「公義與公益」的大學。前四屆（85–88 學年度）學生均享學雜費全免之待遇；為持續回饋社會、嘉惠學子、獎優扶弱，並因應少子化危機，在董事會全力支持下，自 103 學年度起入學新生全面比照國立大學收費。'],
  ['1-2','本校學術單位有 5 個學院、1 個通識教育中心、18 個學系、2 個學士學位學程、2 個進修學士班、20 個碩士班、1 個碩士學位學程、11 個碩士在職專班、1 個碩士在職學位學程及 2 個博士班；行政單位共有 13 個一級單位、45 個二級單位，並設置 4 個校級研究中心，致力發展學校特色。'],
  ['1-5','本校以「生命價值的提昇與永續發展，培養慧道中流的南華人」為教育願景；自我基本定位為「生命關懷、公益公義、國際知名教學卓越大學」；實踐「以生命力帶動三好生命力、以學習力提升就業競爭力、以全球觀促進國際移動力」的教育理念。'],
  ['1-5','以「飛躍南華、獎優扶弱、追求卓越、邁向國際」為辦學方針；以「生命教育、環境永續、智慧創新、三好校園」為辦學特色；並採取「優質教學、適性輔導、研發產學、永續環境、國際移動、身心靈產業」六大發展主軸策略，落實教育願景、自我定位與教育理念。'],
  ['1-3','近三年全校學生人數為 4,894、4,690、4,474 人（112–114 學年度，實際數），受少子女化影響呈下降趨勢；學制別分布為示範估算，正式版請以校庫填報數據替換。'],
  ['1-4','日間學士新生註冊率 112–114 學年度為 88.44%、88.06%、90.40%，就學穩定率為 85.60%、88.18%、83.99%，招生與留生成效穩定（獎補助審查委員肯定事項）。境外學位生 114 年達 166 人、較前一年成長 11.4%。'],
  ['1-8','本頁指標與校務發展計畫量化指標逐項對應。綠色為達標、紅色為未達標；未達標項目不隱藏，改善對策如下：校外實習人次下滑，已規劃拓展在地合作機構並將實習納入課程模組；期刊論文推動 Mentor 制度並強化國際收錄期刊占比。（示範文字）'],
  ['1-9','董事會財務資訊依規定公開專任董事薪酬、無給職董監事出席費與交通費，及每筆逾 10 萬元收支。']],

/* ── Google 試算表載入（gviz JSON，不需 API 金鑰）── */
async function gv(id, sheetName){
  const url = `https://docs.google.com/spreadsheets/d/${id}/gviz/tq?tqx=out:json&headers=1&sheet=${encodeURIComponent(sheetName)}`;
  const r = await fetch(url); if(!r.ok) throw 0;
  const t = await r.text();
  const j = JSON.parse(t.substring(t.indexOf('{'), t.lastIndexOf('}')+1));
  const headers = j.table.cols.map(c=>c.label||'');
  const rows = j.table.rows.map(row=>row.c.map(c=>c==null?'':(c.v??'')));
  return [headers, ...rows];
}
async function loadAll(){
  if(GAS_URL){
    try{
      const r = await fetch(GAS_URL);
      const j = await r.json();
      for(const [name,tbl] of Object.entries(j)){
        if(!Array.isArray(tbl) || !tbl.length) continue;
        for(const [k,cfg] of Object.entries(CONFIG)){
          if(cfg.sheets.includes(name)){ DATA[k][name]=tbl; LOADED.add(k+':'+name); }
        }
      }
      if(LOADED.size) return;   // 資料服務成功即不再走 gviz
    }catch(e){ /* 退回 gviz */ }
  }
  const jobs = [];
  for(const [k,cfg] of Object.entries(CONFIG)){
    if(!cfg.id) continue;
    for(const s of cfg.sheets){
      jobs.push(gv(cfg.id, s).then(tbl=>{ DATA[k][s]=tbl; LOADED.add(k+':'+s); }).catch(()=>{}));
    }
  }
  await Promise.allSettled(jobs);
}
const sheet = (k,n)=> (DATA[k]||{})[n] || [];
const rows  = (k,n)=> sheet(k,n).slice(1);
const heads = (k,n)=> sheet(k,n)[0] || [];
const texts = (k,page)=>{
  const loaded = Object.keys(DATA).filter(f=>LOADED.has(f+':文字說明')).flatMap(f=>rows(f,'文字說明'));
  const pool = loaded.length ? loaded : Object.keys(DATA).flatMap(f=>rows(f,'文字說明'));
  return pool.filter(r=>String(r[0])===page).map(r=>String(r[1]||'')).filter(Boolean);
};

const fmt = v => typeof v==='number' ? v.toLocaleString('zh-Hant') : v;
const link = (u,l='PDF')=> u ? `<a href="${u}" target="_blank" rel="noopener">${l}</a>` : '—';
const csvLink = n => GAS_URL
  ? `<div style="margin-top:.35rem"><a class="dl" href="${GAS_URL}?csv=${encodeURIComponent(n)}">⬇ 下載本表資料（CSV）</a></div>` : '';

/* ============ 互動圖表元件（跨年度／系列勾選、圖型切換） ============ */
const INTER = {};
let charts = [];
function interactive(cid, o){ // o:{key,sheet,unit,type,percent,stack}
  const ys = yearsOf(o.key,o.sheet), sers = rows(o.key,o.sheet).map(r=>String(r[0]));
  INTER[cid] = INTER[cid] || {years:new Set(ys), sers:new Set(sers), type:o.type||'bar', o};
  const st = INTER[cid]; st.o = o;
  const chips = (list, set, kind)=> list.map(v=>
    `<span class="chip ${set.has(v)?'on':''}" onclick="toggleChip('${cid}','${kind}','${v.replace(/'/g,"\\'")}')">${v}</span>`).join('');
  return `
  <div class="ctrl" role="group" aria-label="圖表控制">
    <div class="g"><span class="lab">學年度</span>${chips(ys, st.years, 'y')}</div>
    <div class="g"><span class="lab">項目</span>${chips(sers, st.sers, 's')}</div>
    <div class="g"><span class="lab">圖型</span>
      <span class="chip ${st.type==='bar'?'on':''}" onclick="setType('${cid}','bar')">長條</span>
      <span class="chip ${st.type==='line'?'on':''}" onclick="setType('${cid}','line')">折線</span></div>
  </div>
  <div class="chart" id="${cid}"></div>
  ${detailsOf(o.key,o.sheet)}`;
}
function detailsOf(k,n){
  return `<details class="tbl"><summary>展開資料表格（無障礙等值內容）</summary>
    <div class="tscroll"><table><thead><tr>${heads(k,n).map(h=>`<th scope="col">${h}</th>`).join('')}</tr></thead>
    <tbody>${rows(k,n).map(r=>`<tr>${r.map(c=>`<td${String(c).startsWith('-')?' class="neg"':''}>${fmt(c)}</td>`).join('')}</tr>`).join('')}</tbody>
    </table></div></details>${csvLink(n)}`;
}
function toggleChip(cid,kind,val){
  const st=INTER[cid], set = kind==='y'?st.years:st.sers;
  set.has(val)? (set.size>1 && set.delete(val)) : set.add(val);
  refreshCtrl(cid); drawInter(cid);
}
function setType(cid,t){ INTER[cid].type=t; refreshCtrl(cid); drawInter(cid); }
function refreshCtrl(cid){
  const el=document.getElementById(cid); if(!el) return;
  const holder=el.previousElementSibling; // .ctrl
  const st=INTER[cid], o=st.o;
  const ys=yearsOf(o.key,o.sheet), sers=rows(o.key,o.sheet).map(r=>String(r[0]));
  const chips=(list,set,kind)=>list.map(v=>
    `<span class="chip ${set.has(v)?'on':''}" onclick="toggleChip('${cid}','${kind}','${v.replace(/'/g,"\\'")}')">${v}</span>`).join('');
  holder.innerHTML = `
    <div class="g"><span class="lab">學年度</span>${chips(ys,st.years,'y')}</div>
    <div class="g"><span class="lab">項目</span>${chips(sers,st.sers,'s')}</div>
    <div class="g"><span class="lab">圖型</span>
      <span class="chip ${st.type==='bar'?'on':''}" onclick="setType('${cid}','bar')">長條</span>
      <span class="chip ${st.type==='line'?'on':''}" onclick="setType('${cid}','line')">折線</span></div>`;
}
function drawInter(cid){
  const st=INTER[cid], o=st.o;
  const ysAll=yearsOf(o.key,o.sheet);
  const ys=ysAll.filter(y=>st.years.has(y));
  const idx=ys.map(y=>ysAll.indexOf(y));
  const sers=rows(o.key,o.sheet).filter(r=>st.sers.has(String(r[0])));
  const opt={...ANIM,color:PALETTE,tooltip:{trigger:'axis'},legend:{bottom:0},
    grid:{left:56,right:20,top:36,bottom:56},
    xAxis:{type:'category',data:ys},
    yAxis:{type:'value',scale:!!o.scale,splitLine:{lineStyle:{color:'#eee'}},
      axisLabel:o.percent?{formatter:'{value}%'}:{}},
    series:sers.map(r=>({name:String(r[0]),type:st.type,
      data:idx.map(i=>r[i+1]),
      ...(st.type==='bar'?{barMaxWidth:46,...(o.stack?{stack:'all'}:{})}
                        :{smooth:true,symbolSize:9,lineStyle:{width:3},label:{show:sers.length<=2}})}))};
  let c = echarts.getInstanceByDom(document.getElementById(cid));
  if(!c){ c = echarts.init(document.getElementById(cid)); charts.push(c); }
  c.setOption(opt, true);
}

function tbl(k,n,map,negCols=[]){

function orgChartHTML(){
  const rs = rows('S1','組織架構').map(r=>[String(r[0]||'').trim(), String(r[1]||'').trim()]).filter(r=>r[1]);
  const kids = {}, parentOf = {};
  rs.forEach(([p,n])=>{ (kids[p]=kids[p]||[]).push(n); parentOf[n]=p; });
  const GROUPS = [['行政單位','adm'],['學術單位','aca'],['校級研究中心','ctr']];
  const groupNames = GROUPS.map(g=>g[0]);
  // 指揮鏈：由群組的上層一路回溯至最上層
  const anchor = groupNames.find(g=>parentOf[g]) || '';
  const chain = []; let cur = parentOf[anchor];
  while(cur){ chain.unshift(cur); cur = parentOf[cur] || null; if(chain.length>10) break; }
  const chainHTML = chain.map((n,i)=>{
    const sides = (kids[n]||[]).filter(c=>c!==chain[i+1] && !groupNames.includes(c));
    return `${i?'<div class="vline"></div>':''}<div class="lvl"><div class="box">${n}</div>${
      sides.map(s=>`<div class="side">${s}</div>`).join('')}</div>`;
  }).join('');
  const colsHTML = GROUPS.map(([g,cls])=>{
    const units = kids[g]||[];
    if(!units.length) return '';
    const body = cls==='ctr'
      ? units.map(u=>`<div class="cbox">${u}</div>`).join('')
      : units.map(u=>`<div class="ogrow"><div class="n">${u}</div><div class="d">${(kids[u]||[]).join('、')||'—'}</div></div>`).join('');
    return `<div class="ogcol ${cls}"><h3>${g==='校級研究中心'?'中心':g}</h3>${body}</div>`;
  }).join('');
  return `<div class="org"><div class="orgchain">${chainHTML}</div><div class="orgcols">${colsHTML}</div></div>`;
}

/* ============ 路由 ============ */
function render(){
  charts.forEach(c=>c.dispose()); charts=[];
  const hash = location.hash.replace('#/','') || 'home';
  const fn = PAGES[hash] || PAGES.home;
  document.getElementById('main').innerHTML = fn();
  const sec = hash==='home' ? 'home' : NAV.find(s=>s.pages&&s.pages.includes(hash))?.id;
  document.querySelectorAll('.rail a').forEach(a=>a.classList.toggle('on', a.dataset.id===sec));
  const s = NAV.find(x=>x.id===sec), sn = document.getElementById('subnav');
  if(s && s.pages){
    sn.hidden = false;
    document.getElementById('subnavIn').innerHTML =
      s.pages.map(p=>`<a href="#/${p}" class="${p===hash?'on':''}">${TITLES[p]}</a>`).join('');
  } else sn.hidden = true;
  scrollTo({top:0});
}
addEventListener('hashchange', render);
addEventListener('resize', ()=>charts.forEach(c=>c.resize()));
addEventListener('keydown', e=>{ if(e.key==='Escape') toggleMenu(false); });
loadAll().finally(render);
</script>
