<style>

以持續改進教學環境與品質。"],["2-2","除此之外，透過產學合作與產業連結開拓研發能量及財源，約 7,679 萬，占總收入 7.14%。在少子化趨勢下，董事會仍持續挹注經費改善學校設備，未來將持續開拓收入來源，維持收支平衡，以期建構永續性的財務結構。"],["2-3","本校秉持公義與公益之創校宗旨，致力於提升教學品質、教學環境及遴聘優良師資等之方針，故支出結構持續朝教學、研究及學生輔導等核心辦學本質與教育政策方向提升，行政管理支出維持於合理水準。另產學合作支出隨相關收入成長而增加，形成良性循環。"],["3-1","本校各學院大學部及研究所每生收費標準如下表所示，本校自 92 學年度起皆未調漲學雜費。"],["3-4","資料來源：校務資料庫「校10-2 配合大專校院弱勢學生助學計畫之其他助學措施」（114 學年度）；占比以 114 學年度在學學生 4,474 人計。就學貸款、學雜費減免由教育部統一匯入，另依教育部公告呈現。"],["4-3","一、本校隨時配合教育部通知辦理應揭露事項公告事宜。"],["4-3","二、自 103 學年度起，依教育部規定應公開資訊以決算書數據並以學年度為基準。"],["4-3","三、教育部獎補助款採購公告網址：http://po3.nhu.edu.tw/"],["4-4","本校自 102 學年度開始推動課程革新，參酌國內外課程革新經驗，經半年檢視、調整、分析與創新，提出「三化成果導向課程模式」，即模組化、學程化及分流化的成果導向課程模式。課程學程化將學習的龐雜課程和新興學科重新安排，劃分成不同階段的學程，如系核心學程、跨領域就業導向學程、專業選修學程等。"],["4-4","具體來說，課程學程化的規劃方式為因應產業需求及學術發展，整合教學資源，建置以學生為導向之專業化精實課程，以強化學生學習深度與廣度，創造優質、多元、具彈性與跨領域的學習環境，以增強學生之軟實力，讓吸收學問之導向明確，強化精要該學科領域之核心學識，學生可依個別興趣或結合生涯規劃自由運用，同時也增加了修讀雙主修和輔修的空間，學生與利害關係人均可於本校網頁查詢相關開課與師資資訊。"],["6-1","本校建立多元回饋機制，徵詢教師、學生、職員、校友、家長、業者等利害關係人對校務及財務資訊公開之意見，並公開學校回應，形成完整留痕。"],["資料來源","資料來源：教育部大專校院校務資料庫 11310–11510 期"]]},"S2":{"收支總覽":[["項目","111學年度","112學年度","113學年度"],["總收入",1982,1943,1905],["總支出",2011,1988,1952],["收支差額",-29,-45,-47]],"收入":[["收入科目","111學年度","112學年度","113學年度"],["學雜費收入",1094,1046,998],["補助及捐贈收入",567,585,600],["推廣教育收入",127,132,137],["財務及其他收入",194,180,170]],"支出":[["支出科目","111學年度","112學年度","113學年度"],["教學研究及訓輔支出",998,985,972],["行政管理支出",412,405,398],["獎助學金支出",290,286,281],["其他支出",311,312,301]]},"S3":{"收費與成本":[["學院","每生每學年學雜費（千元）","每生平均教學成本（千元）","學雜費占成本比"],["人文學院",49.6,168,0.295],["社會科學院",49.6,152,0.326],["科技學院",54.3,204,0.266],["藝術學院",53.1,215,0.247],["管理學院",49.6,148,0.335]],"支出估算":[["項目","每學年估算（千元）"],["學雜費",50],["住宿費（校內雙人房）",22],["生活費（餐飲交通書籍）",96],["合計",168]],"助學措施":[["類別","措施","提供單位"],["獎學金","成績優異獎學金、特殊才能獎學金","學校"],["助學金","弱勢學生助學計畫、緊急紓困金","政府／學校"],["貸款","就學貸款（利息補貼）","政府"],["工讀","校內學習型兼任助理","學校"],["民間","佛光山百萬人興學獎助","民間"]],"助學統計":[["項目（114學年度）","人數(次)","占在學學生比","金額（千元）"],["工讀助學金",966,0.216,19932],["研究生獎助學金",116,0.026,4498],["生活助學金",93,0.021,2040],["其他校內助學措施",3 /* 需固定使用內建資料、不讀試算表的分頁名稱放這裡（預設全部以 Google 試算表為準） */
const PINNED=new Set([]);
/* 試算表分頁可用性檢查：分頁不存在時 gviz 會回傳第一個分頁，故比對第 1 欄標題 */
const sameShape=(a,b)=>!Array.isArray(b)||!b.length||String((a[0]||[])[0]||'').trim()===String((b[0]||[])[0]||'').trim();

/* ── Google 試算表載入（gviz JSON，不需 API 金鑰）── */
async function gv(id, sheetName){
  const url = `https://docs.google.com/spreadsheets/d/${id}/gviz/tq?tqx=out:json&headers=1&sheet=${encodeURIComponent(sheetName)}&_=${Math.floor(Date.now()/60000)}`;
  const r = await fetch(url); if(!r.ok) throw 0;
  const t = await r.text();
  const j = JSON.parse(t.substring(t.indexOf('{'), t.lastIndexOf('}')+1));
  const headers = j.table.cols.map(c=>c.label||'');
  const rows = j.table.rows.map(row=>row.c.map(c=>c==null?'':(c.v??'')));
  return [headers, ...rows];
}
/* 線上試算表若比內嵌資料舊（最新學年度較小），保留內嵌資料 */
function newestYear(tbl){
  if(!Array.isArray(tbl)||!tbl.length) return -1;
  const h=tbl[0].map(x=>{const m=String(x).match(/(\d{3})\s*學年度/);return m?+m[1]:null}).filter(v=>v!==null);
  if(h.length) return Math.max(...h);
  const yc=tbl[0].findIndex(x=>/^(學年度|年度)$/.test(String(x).trim()));
  if(yc>=0){const v=tbl.slice(1).map(r=>parseInt(r[yc])).filter(Number.isFinite); if(v.length) return Math.max(...v);}
  return 0;
}
async function loadAll(){
  if(GAS_URL){
    try{
      const r = await fetch(GAS_URL+(GAS_URL.includes('?')?'&':'?')+'_='+Date.now());
      const j = await r.json();
      for(const [name,tbl] of Object.entries(j)){
        if(!Array.isArray(tbl) || !tbl.length) continue;
        for(const [k,cfg] of Object.entries(CONFIG)){
          if(cfg.sheets.includes(name) && !PINNED.has(name) && sameShape(tbl,DATA[k][name])){ if(newestYear(tbl) >= newestYear(DATA[k][name])) DATA[k][name]=tbl; LOADED.add(k+':'+name); }
        }
      }
      if(LOADED.size) return;   // 資料服務成功即不再走 gviz
    }catch(e){ /* 退回 gviz */ }
  }
  const jobs = [];
  for(const [k,cfg] of Object.entries(CONFIG)){
    if(!cfg.id) continue;
    for(const s of cfg.sheets){
      jobs.push(gv(cfg.id, s).then(tbl=>{ if(PINNED.has(s) || !sameShape(tbl,DATA[k][s])) return; if(newestYear(tbl) >= newestYear(DATA[k][s])) DATA[k][s]=tbl; LOADED.add(k+':'+s); }).catch(()=>{}));
    }
  }
  await Promise.allSettled(jobs);
}
const sheet = (k,n)=> (DATA[k]||{})[n] || [];
const rows  = (k,n)=> sheet(k,n).slice(1);
const heads = (k,n)=> sheet(k,n)[0] || [];
/* 線上「文字說明」須含「版本」列才採用，避免舊版示範文字覆蓋 */
const EMBED_TEXT = DATA.S1['文字說明'];
const texts = (k,page)=>{
  const online = Object.keys(DATA).filter(f=>LOADED.has(f+':文字說明')).map(f=>DATA[f]['文字說明']).filter(t=>Array.isArray(t)&&t.some(r=>String(r[0]).trim()==='版本'));
  const pool = online.length ? online.flatMap(t=>t.slice(1)) : EMBED_TEXT.slice(1);
  return pool.filter(r=>String(r[0]).trim()===page).map(r=>String(r[1]||'')).filter(Boolean);
};
const yearsOf = (k,n)=> heads(k,n).slice(1).map(String);
const lastYear = ()=> { const y=yearsOf('S1','學生人數'); return y[y.length-1]||''; };

/* ── 最新學年度優先呈現 ──────────────────────────────────────
   ① 學年度為「欄」的表（學生人數、收支總覽等）：依學年度排序，只呈現最新 3 個學年度
      → 試算表新增「115學年度」欄後，網站自動改顯示 113–115，舊年度留在試算表不刪也可。
   ② 學年度為「列」的表（報告清單、採購處分連結、評鑑結果等）：依學年度由新到舊排列。
   欄名可帶註記，如「115學年度（檢核版）」仍可正確辨識。 */
const YEAR_WINDOW = 3;
const yearNum = s => { const m = String(s).match(/^\s*(\d{3})\s*學年度/); return m ? +m[1] : null; };
function normalizeAll(){
  for(const file of Object.keys(DATA)){
    for(const [name, tbl] of Object.entries(DATA[file])){
      if(!Array.isArray(tbl) || !tbl.length || name==='文字說明') continue;
      const head = tbl[0];
      const yIdx = head.map((h,i)=>[yearNum(h),i]).filter(x=>x[0]!==null);
      if(yIdx.length){
        const keep = yIdx.sort((a,b)=>a[0]-b[0]).slice(-YEAR_WINDOW).map(x=>x[1]);
        const fixed = head.map((h,i)=>i).filter(i=>yearNum(head[i])===null);
        const order = [...fixed, ...keep];
        DATA[file][name] = tbl.map(r=>order.map(i=>r[i]===undefined?'':r[i]));
        continue;
      }
      const yc = head.findIndex(h=>/^(學年度|年度)$/.test(String(h).trim()));
      if(yc>=0){
        const body = tbl.slice(1).map((r,i)=>[r,i]);
        body.sort((a,b)=>((parseInt(b[0][yc])||0)-(parseInt(a[0][yc])||0)) || (a[1]-b[1]));
        DATA[file][name] = [head, ...body.map(x=>x[0])];
      }
    }
  }
}
/* 各頁徽章：取該頁資料表自身的最新學年度 */
function latestYearOf(k,n){
  const h = heads(k,n);
  const ys = h.map(yearNum).filter(v=>v!==null);
  if(ys.length) return Math.max(...ys)+'學年度';
  const yc = h.findIndex(x=>/^(學年度|年度)$/.test(String(x).trim()));
  if(yc>=0){ const v = rows(k,n).map(r=>parseInt(r[yc])).filter(Number.isFinite); if(v.length) return Math.max(...v)+'學年度'; }
  return lastYear();
}
const pct = v => (typeof v==='number' && v<1 ? (v*100).toFixed(1)+'%' : v);
const fmt = v => typeof v==='number' ? v.toLocaleString('zh-Hant') : v;
const link = (u,l='PDF')=> u ? `<a href="${u}" target="_blank" rel="noopener">${l}</a>` : '—';

const PALETTE = ['#2f8256','#7cc49a','#3d8fb8','#e0a63b','#5fb3a9','#9bc75a','#8a77c2','#e07a5f'];
const reduced = matchMedia('(prefers-reduced-motion: reduce)').matches;
const ANIM = reduced ? {animation:false} : {animationDuration:1000, animationEasing:'cubicOut'};

/* ============ 互動圖表元件（跨年度／系列勾選、圖型切換） ============ */
const INTER = {};
let charts = [];
function interactive(cid, o){ // o:{key,sheet,unit,type,percent,stack}
  const ys = yearsOf(o.key,o.sheet), sers = rows(o.key,o.sheet).map(r=>String(r[0]));
  INTER[cid] = INTER[cid] || {years:new Set(ys), sers:new Set(sers), type:o.type||'bar', o};
  const st = INTER[cid]; st.o = o;
  const chips = (list, set, kind)=> list.map(v=>
    `<span class="chip ${set.has(v)?'on':''}" onclick="toggleChip('${cid}','${kind}','${v.replace(/'/g,"\\'")}')">${v}</span>`).join('');
  return `
  <div class="ctrl" role="group" aria-label="圖表控制">
    <div class="g"><span class="lab">學年度</span>${chips(ys, st.years, 'y')}</div>
    <div class="g"><span class="lab">項目</span>${chips(sers, st.sers, 's')}</div>
    <div class="g"><span class="lab">圖型</span>
      <span class="chip ${st.type==='bar'?'on':''}" onclick="setType('${cid}','bar')">長條</span>
      <span class="chip ${st.type==='line'?'on':''}" onclick="setType('${cid}','line')">折線</span></div>
  </div>
  <div class="chart" id="${cid}"></div>
  <div class="ydiff" id="${cid}-diff"></div>
  ${detailsOf(o.key,o.sheet)}`;
}
function detailsOf(k,n){
  return `<details class="tbl"><summary>展開資料表格（無障礙等值內容）</summary>
    <div class="tscroll"><table><thead><tr>${heads(k,n).map(h=>`<th scope="col">${h}</th>`).join('')}</tr></thead>
    <tbody>${rows(k,n).map(r=>`<tr>${r.map(c=>`<td${String(c).startsWith('-')?' class="neg"':''}>${fmt(c)}</td>`).join('')}</tr>`).join('')}</tbody>
    </table></div></details>${csvLink(n)}`;
}
function toggleChip(cid,kind,val){
  const st=INTER[cid], set = kind==='y'?st.years:st.sers;
  set.has(val)? (set.size>1 && set.delete(val)) : set.add(val);
  refreshCtrl(cid); drawInter(cid);
}
function setType(cid,t){ INTER[cid].type=t; refreshCtrl(cid); drawInter(cid); }
function refreshCtrl(cid){
  const el=document.getElementById(cid); if(!el) return;
  const holder=el.previousElementSibling; // .ctrl
  if(!holder||!holder.classList.contains('ctrl')) return;
  const st=INTER[cid], o=st.o;
  const ys=yearsOf(o.key,o.sheet), sers=rows(o.key,o.sheet).map(r=>String(r[0]));
  const chips=(list,set,kind)=>list.map(v=>
    `<span class="chip ${set.has(v)?'on':''}" onclick="toggleChip('${cid}','${kind}','${v.replace(/'/g,"\\'")}')">${v}</span>`).join('');
  holder.innerHTML = `
    <div class="g"><span class="lab">學年度</span>${chips(ys,st.years,'y')}</div>
    <div class="g"><span class="lab">項目</span>${chips(sers,st.sers,'s')}</div>
    <div class="g"><span class="lab">圖型</span>
      <span class="chip ${st.type==='bar'?'on':''}" onclick="setType('${cid}','bar')">長條</span>
      <span class="chip ${st.type==='line'?'on':''}" onclick="setType('${cid}','line')">折線</span></div>`;
}
function drawInter(cid){
  const st=INTER[cid], o=st.o;
  const ysAll=yearsOf(o.key,o.sheet);
  const ys=ysAll.filter(y=>st.years.has(y));
  const idx=ys.map(y=>ysAll.indexOf(y));
  const sers=rows(o.key,o.sheet).filter(r=>st.sers.has(String(r[0])));
  const opt={...ANIM,color:PALETTE,tooltip:{trigger:'axis'},legend:{top:0,left:'center',itemGap:14,textStyle:{fontSize:16}},
    grid:{left:12,right:20,top:sers.length>6?78:48,bottom:12,containLabel:true},
    xAxis:{type:'category',data:ys},
    yAxis:{type:'value',scale:!!o.scale,splitLine:{lineStyle:{color:'#eee'}},
      axisLabel:o.percent?{formatter:'{value}%'}:{}},
    series:sers.map(r=>({name:String(r[0]),type:st.type,
      data:idx.map(i=>r[i+1]),
      ...(st.type==='bar'?{barMaxWidth:46,...(o.stack?{stack:'all'}:{})}
                        :{smooth:true,symbolSize:9,lineStyle:{width:3},label:{show:sers.length<=2}})}))};
  let c = echarts.getInstanceByDom(document.getElementById(cid));
  if(!c){ c = echarts.init(document.getElementById(cid)); charts.push(c); }
  c.setOption(opt, true);
  drawDiff(cid, ys, idx, sers, o);

function drawDiff(cid, ys, idx, sers, o){
  const box=document.getElementById(cid+'-diff'); if(!box) return;
  if(ys.length!==2){ box.innerHTML = ys.length>2?'<p class="yd-hint">只選兩個學年度時，會顯示兩年度的差距比較</p>':''; return; }
  const [a,b]=ys, n=v=>+String(v??'').replace(/[^\d.-]/g,'')||0;
  const f=v=>(Math.round(v*10)/10).toLocaleString('zh-TW');
  const unit=o.percent?'百分點':(o.unit||'');
  let ta=0,tb=0;
  const tr=sers.map(r=>{const x=n(r[idx[0]+1]),y=n(r[idx[1]+1]),d=y-x;ta+=x;tb+=y;
    const p=x?d/Math.abs(x)*100:null, cls=d>0?'up':d<0?'dn':'';
    return `<tr><th scope="row">${r[0]}</th><td>${f(x)}</td><td>${f(y)}</td><td class="${cls}">${d>0?'▲ +':d<0?'▼ ':''}${f(d)}</td><td class="${cls}">${p==null||o.percent?'–':(p>0?'+':'')+p.toFixed(1)+'%'}</td></tr>`}).join('');
  const td=tb-ta, tp=ta?td/Math.abs(ta)*100:null, tc=td>0?'up':td<0?'dn':'';
  const tot=(!o.percent&&sers.length>1)?`<tfoot><tr><th scope="row">合計</th><td>${f(ta)}</td><td>${f(tb)}</td><td class="${tc}">${td>0?'▲ +':td<0?'▼ ':''}${f(td)}</td><td class="${tc}">${tp==null?'–':(tp>0?'+':'')+tp.toFixed(1)+'%'}</td></tr></tfoot>`:'';
  box.innerHTML=`<h3 class="yd-t">${a} → ${b} 差距比較${unit?`<small>（單位：${unit}）</small>`:''}</h3><div class="tscroll"><table class="yd"><thead><tr><th scope="col">項目</th><th scope="col">${a}</th><th scope="col">${b}</th><th scope="col">增減</th><th scope="col">增減率</th></tr></thead><tbody>${tr}</tbody>${tot}</table></div>`;
}

function orgChartHTML(){
  const rs = rows('S1','組織架構').map(r=>[String(r[0]||'').trim(), String(r[1]||'').trim()]).filter(r=>r[1]);
  const kids = {}, parentOf = {};
  rs.forEach(([p,n])=>{ (kids[p]=kids[p]||[]).push(n); parentOf[n]=p; });
  const GROUPS = [['行政單位','adm'],['學術單位','aca'],['校級研究中心','ctr']];
  const groupNames = GROUPS.map(g=>g[0]);
  // 指揮鏈：由群組的上層一路回溯至最上層
  const anchor = groupNames.find(g=>parentOf[g]) || '';
  const chain = []; let cur = parentOf[anchor];
  while(cur){ chain.unshift(cur); cur = parentOf[cur] || null; if(chain.length>10) break; }
  const chainHTML = chain.map((n,i)=>{
    const sides = (kids[n]||[]).filter(c=>c!==chain[i+1] && !groupNames.includes(c));
    return `${i?'<div class="vline"></div>':''}<div class="lvl"><div class="box">${n}</div>${
      sides.map(s=>`<div class="side">${s}</div>`).join('')}</div>`;
  }).join('');
  const colsHTML = GROUPS.map(([g,cls])=>{
    const units = kids[g]||[];
    if(!units.length) return '';
    const body = cls==='ctr'
      ? units.map(u=>`<div class="cbox">${u}</div>`).join('')
      : units.map(u=>`<div class="ogrow"><div class="n">${u}</div><div class="d">${(kids[u]||[]).join('、')||'—'}</div></div>`).join('');
    return `<div class="ogcol ${cls}"><h3>${g==='校級研究中心'?'中心':g}</h3>${body}</div>`;
  }).join('');
  return `<div class="org"><div class="orgchain">${chainHTML}</div><div class="orgcols">${colsHTML}</div></div>`;
}

  ['(1) 近 3 年學校收入分析（學校經費來源）：各項收入占學校總收入比率','https://nhuinfo.nhu.edu.tw/Web/Pages?mid=4141&n=(1)%E8%BF%913%E5%B9%B4%E5%AD%B8%E6%A0%A1%E6%94%B6%E5%85%A5%E5%88%86%E6%9E%90%EF%BC%88%E5%AD%B8%E6%A0%A1%E7%B6%93%E8%B2%BB%E4%BE%86%E6%BA%90%EF%BC%89%EF%BC%9A%E5%90%84%E9%A0%85%E6%94%B6%E5%85%A5%E5%8D%A0%E5%AD%B8%E6%A0%A1%E7%B8%BD%E6%94%B6%E5%85%A5%E6%AF%94%E7%8E%87'],
];
function finRelated(){
  return `<section class="blk"><h2>相關資訊</h2><ul class="rel">${FIN_LINKS.map(([t,u])=>
    `<li><a href="${u}" target="_blank" rel="noopener"><span>${t}</span><b aria-hidden="true">↗</b></a></li>`).join('')}</ul></section>`;
}
const FIN_DESC={
 '收入':['學雜費收入及董事會挹注經費為本校主要收入來源，分別為 4.07 億、2.86 億，占總收入 37.89%、26.68%。另教育部「獎勵私立大學校院校務發展計畫獎勵及補助經費」、「高等教育深耕計畫」及其他專案補助計畫，亦為本校財源之一，約 2.07 億，占總收入 19.31%，令本校得以持續改進教學環境與品質。','除此之外，透過產學合作與產業連結開拓研發能量及財源，約 7,679 萬，占總收入 7.14%。在少子化趨勢下，董事會仍持續挹注經費改善學校設備，未來將持續開拓收入來源，維持收支平衡，以期建構永續性的財務結構。'],
 '支出':['本校秉持公義與公益之創校宗旨，致力於提升教學品質、教學環境及遴聘優良師資等之方針，故支出結構持續朝教學、研究及學生輔導等核心辦學本質與教育政策方向提升，行政管理支出維持於合理水準。另產學合作支出隨相關收入成長而增加，形成良性循環。']};
function finPage(key, kind){
  const dk='S2';
  const cid = 'ifin_'+key;
  const ys = yearsOf(dk,kind), latest = ys[ys.length-1]||'', li = ys.length;
  const html = pageShell({key,section:'財務資訊分析',ref:{file:dk,sheet:kind},desc:FIN_DESC[kind].map(p=>`<p>${p}</p>`).join(''),
    fallbackDesc:`<p>近三年學校${kind}分析：各項${kind}占學校總${kind}比率，可跨年度比較。</p>`,
    bodyHTML:`<section class="blk"><h2>${latest}各項${kind}占全校總${kind}比率</h2><div class="chart" id="pie_${key}" style="height:400px"></div></section><section class="blk"><h2>${ys[0]}～${latest}各項${kind}比較（萬元）</h2>${interactive(cid,{key:dk,sheet:kind,type:'bar'})}</section>`,
    owner:'會計室'});
  setTimeout(()=>{ drawInter(cid);
    const el=document.getElementById('pie_'+key); if(!el) return;
    const rs=rows(dk,kind), total=rs.reduce((s,r)=>s+(+r[li]||0),0);
    const c=echarts.init(el); charts.push(c);
    c.setOption({...ANIM,color:PALETTE,
      tooltip:{formatter:p=>`${p.name}<br>${p.value.toLocaleString('zh-Hant')} 萬元（${p.percent.toFixed(2)}%）`},
      legend:{type:'scroll',bottom:0},
      series:[{type:'pie',radius:['42%','68%'],center:['50%','45%'],avoidLabelOverlap:true,itemStyle:{borderColor:'#fff',borderWidth:2},
        label:{formatter:p=>`${p.name}\n${p.percent.toFixed(2)}%`,fontSize:16,lineHeight:16},
        data:rs.map(r=>({name:String(r[0]),value:+r[li]||0}))},
        {type:'pie',radius:[0,0],center:['50%','45%'],label:{show:true,position:'center',formatter:`${latest}\n總${kind}\n${(total/10000).toFixed(2)} 億元`,fontSize:16,fontWeight:'bold',lineHeight:22,color:'#1a1a1a'},data:[{value:1}],tooltip:{show:false}}]});
  });
  return html;
}

/* ============ 路由 ============ */
function render(){
  charts.forEach(c=>c.dispose()); charts=[];
  const hash = location.hash.replace('#/','') || 'home';
  const tm = hash.match(/^1-6-(\d+)$/);
  const fn = tm ? ()=>PAGES.themePage(+tm[1]) : (PAGES[hash] || PAGES.home);
  document.getElementById('main').innerHTML = fn();
  const cur = tm ? '1-6' : hash;
  const sec = hash==='home' ? 'home' : NAV.find(s=>s.pages&&s.pages.includes(cur))?.id;
  document.querySelectorAll('.rail a').forEach(a=>a.classList.toggle('on', a.dataset.id===sec));
  const s = NAV.find(x=>x.id===sec), sn = document.getElementById('subnav');
  if(s && s.pages){
    sn.hidden = false;
    document.getElementById('subnavIn').innerHTML =
      s.pages.map(p=>`<a href="#/${p}" class="${p===cur?'on':''}">${TITLES[p]}</a>`).join('');
  } else sn.hidden = true;
  scrollTo({top:0});
}
addEventListener('hashchange', render);
addEventListener('resize', ()=>charts.forEach(c=>c.resize()));
addEventListener('keydown', e=>{ if(e.key==='Escape') toggleMenu(false); });
function showStatus(){
  const el=document.getElementById('dataStatus'); if(el) el.remove(); return;
  const t=new Date().toLocaleTimeString('zh-Hant',{hour:'2-digit',minute:'2-digit'});
  const ok=LOADED.size>0;
  el.className='dstat '+(ok?'on':'off');
  el.innerHTML=`<i></i><span>${ok?`資料來源：Google 試算表（${LOADED.size} 個分頁，讀取於 ${t}）`:'目前顯示內建資料（試算表未連線）'}</span><button type="button" onclick="location.reload()">重新讀取</button>`;
}
loadAll().finally(()=>{ normalizeAll(); render(); showStatus(); });
</script>
